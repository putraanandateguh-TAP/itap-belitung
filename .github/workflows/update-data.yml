name: Update data harian (harga pangan, kurs & IHSG)
# Mandiri di GitHub Actions — tidak bergantung pada asisten/kredit apa pun.
# Jadwal (WIB = UTC+7). Menit sengaja bukan :00 karena slot :00 paling sering
# dilewati GitHub. Tiap jalan terjadwal memeriksa kebasian data lewat
# scripts/gate_update.py, jadi slot yang telat/terlewat ditambal slot berikutnya.
on:
  schedule:
    - cron: "7 0 * * *"             # 07:07 WIB tiap hari: harga pangan (cadangan di slot lain)
    - cron: "17 2,5,9 * * 1-5"      # 09:17, 12:17, 16:17 WIB Senin-Jumat: kurs BCA, IHSG, emas
    - cron: "23 23,5,11 * * *"      # 06:23, 12:23, 18:23 WIB tiap hari: berita & loker
    - cron: "47 1,3,7 * * *"        # 08:47, 10:47, 14:47 WIB: penambal bila slot di atas terlewat
  workflow_dispatch:
    inputs:
      target: {description: "pangan | keuangan | berita | loker | semua", default: semua}
permissions: {contents: write}
concurrency: {group: update-data, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install beautifulsoup4
      - name: Tentukan yang perlu diperbarui
        id: gate
        env: {EVENT: "${{ github.event_name }}", TARGET: "${{ inputs.target }}"}
        run: python3 scripts/gate_update.py
      - name: Harga pangan (ADAT Belitung)
        if: steps.gate.outputs.pangan == 'true'
        run: python3 scripts/update_harga.py || (echo "::warning::Harga pangan gagal, data lama dipertahankan"; git checkout -- data/harga-pangan.json)
      - name: Kurs BCA, IHSG & emas
        if: steps.gate.outputs.keuangan == 'true'
        run: python3 scripts/update_keuangan.py || (echo "::warning::Keuangan gagal, data lama dipertahankan"; git checkout -- data/keuangan.json)
      - name: Berita Belitung
        if: steps.gate.outputs.berita == 'true'
        run: python3 scripts/update_berita.py || (echo "::warning::Berita gagal, data lama dipertahankan"; git checkout -- data/berita.json || true)
      - name: Lowongan kerja Belitung
        if: steps.gate.outputs.loker == 'true'
        run: python3 scripts/update_loker.py || (echo "::warning::Loker gagal, data lama dipertahankan"; git checkout -- data/loker.json || true)
      - name: Commit kalau ada perubahan
        run: |
          python3 -c "import json;[json.load(open(f)) for f in ('data/harga-pangan.json','data/keuangan.json','data/berita.json','data/loker.json')]" || git checkout -- data/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/harga-pangan.json data/keuangan.json data/berita.json data/loker.json
          git diff --cached --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "data harian $(TZ=Asia/Jakarta date '+%F %H:%M') WIB"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done; exit 1
