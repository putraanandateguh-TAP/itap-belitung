plugins {
    id "com.android.application"
}

def keystorePath = System.getenv("ITAP_KEYSTORE")

android {
    namespace "id.my.itapbelitung"
    compileSdk 34

    defaultConfig {
        applicationId "id.my.itapbelitung"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0-test"
    }

    signingConfigs {
        testKey {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("ITAP_STORE_PASS")
                keyAlias System.getenv("ITAP_KEY_ALIAS")
                keyPassword System.getenv("ITAP_KEY_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            if (keystorePath) {
                signingConfig signingConfigs.testKey
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
